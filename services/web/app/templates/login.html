{% extends "base.html" %}
{% block title %}Đăng nhập · iBanking{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8">
  <div class="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
    <div class="bg-gradient-to-r from-blue-700 to-blue-900 p-6 text-white text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-white/10 rounded-full mb-3">
        <svg class="w-6 h-6 text-yellow-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
      </div>
      <h1 class="text-xl font-bold">Đăng nhập tài khoản</h1>
      <p class="text-xs text-blue-200 mt-1">Hệ thống dịch vụ iBanking TDTU</p>
    </div>

    <div class="p-6">
      {% if error %}
      <div class="mb-5 bg-red-50 border-l-4 border-red-500 p-3 rounded-r text-sm text-red-700 flex items-start space-x-2">
        <svg class="w-5 h-5 text-red-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div>
          <label for="username" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
            Tên đăng nhập
          </label>
          <div class="relative">
            <input id="username" name="username" type="text" value="{{ username or '' }}" required autofocus
                   placeholder="nguyenvana"
                   class="w-full px-3 py-2 pl-10 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </div>
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
            Mật khẩu
          </label>
          <div class="relative">
            <input id="password" name="password" type="password" required
                   placeholder="••••••"
                   class="w-full px-3 py-2 pl-10 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
          </div>
        </div>

        <button type="submit"
                class="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-2.5 px-4 rounded-lg shadow-sm transition flex items-center justify-center space-x-2">
          <span>Đăng nhập</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </button>
      </form>

      <!-- Gợi ý tài khoản mẫu -->
      <div class="mt-6 pt-6 border-t border-slate-100">
        <p class="text-xs font-medium text-slate-500 mb-2">Tài khoản thử nghiệm có sẵn (mật khẩu: <code class="text-blue-700 font-bold">123456</code>):</p>
        <div class="grid grid-cols-3 gap-2 text-center text-xs">
          <button type="button" onclick="fillUser('nguyenvana')"
                  class="p-2 border border-slate-200 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition">
            <div class="font-bold text-slate-700">Nguyễn Văn A</div>
            <div class="text-[10px] text-slate-500">nguyenvana</div>
          </button>
          <button type="button" onclick="fillUser('lethib')"
                  class="p-2 border border-slate-200 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition">
            <div class="font-bold text-slate-700">Lê Thị B</div>
            <div class="text-[10px] text-slate-500">lethib</div>
          </button>
          <button type="button" onclick="fillUser('phamvanc')"
                  class="p-2 border border-slate-200 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition">
            <div class="font-bold text-slate-700">Phạm Văn C</div>
            <div class="text-[10px] text-slate-500">phamvanc</div>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function fillUser(username) {
  document.getElementById('username').value = username;
  document.getElementById('password').value = '123456';
}
</script>
{% endblock %}
